services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bank_abzar
      POSTGRES_USER: bank_abzar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_abzar -d bank_abzar"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://bank_abzar:${POSTGRES_PASSWORD}@db:5432/bank_abzar
      SESSION_COOKIE_NAME: bank_abzar_session
      SESSION_TTL_HOURS: 168
      SMS_PROVIDER: disabled
      PAYMENT_PROVIDER: disabled
      ALLOW_MOCK_PAYMENTS: "false"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
