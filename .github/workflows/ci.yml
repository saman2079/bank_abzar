name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://bank_abzar:bank_abzar_ci@localhost:5432/bank_abzar
      NEXT_PUBLIC_SITE_URL: https://example.com
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bank_abzar
          POSTGRES_PASSWORD: bank_abzar_ci
          POSTGRES_DB: bank_abzar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bank_abzar -d bank_abzar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test --if-present

      # build صفحه‌های کاتالوگ را از دیتابیس می‌خواند، پس اول schema و seed.
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run build

      - run: npm audit --omit=dev --audit-level=high