name: bank-abzar-dev

# فقط برای توسعه‌ی محلی. compose پروداکشن در فاز ۹ جدا ساخته می‌شود.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bank_abzar
      POSTGRES_PASSWORD: bank_abzar_dev
      POSTGRES_DB: bank_abzar
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_abzar -d bank_abzar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: